name: PPA CI

# Production (Vercel and Render) deploys from perf/add-request-diagnostics,
# so CI must run there as well as on main. Vercel deploys on push in
# parallel with CI; a red run means the live frontend may be broken and the
# manual Render deploy must wait until CI is green again.
on:
  push:
    branches:
      - main
      - perf/add-request-diagnostics
  pull_request:
    branches:
      - main
      - perf/add-request-diagnostics
  # "Run workflow" button in the Actions tab, for any branch.
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ppa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ppa_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      FLASK_ENV: testing
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ppa_test
      JWT_SECRET_KEY: ci-only-test-jwt-key-not-a-real-secret-0123456789abcdef
      SECRET_KEY: ci-test-secret
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Validate backend
        run: python -m compileall -q app run.py config.py init_db.py

      - name: Run backend tests
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: ./portfolio-app
        run: npm ci

      # Runs every frontend Jest test once (no watch mode) and fails the
      # workflow if any test fails, before the production build step.
      - name: Run frontend tests
        working-directory: ./portfolio-app
        env:
          CI: "true"
        run: npm test -- --watchAll=false

      - name: Build frontend
        working-directory: ./portfolio-app
        run: npm run build

  # PPA AI service (ai_service/, FastAPI). Added Nov 27, 2026, before its first deploy.
  # Runs in parallel with the job above. Its database tests need Postgres with pgvector,
  # the same image as the local container (ai_service/docker-compose.yml). No Groq or
  # Gemini key is used: the tests use fake models and a fake embedder.
  ai-service:
    runs-on: ubuntu-latest

    services:
      ai-postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: ppa_ai
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ppa_ai
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U ppa_ai -d ppa_ai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      AI_ENV: test
      AI_DATABASE_URL: postgresql://ppa_ai:ci-only-not-a-secret@localhost:5434/ppa_ai

    defaults:
      run:
        working-directory: ./ai_service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI service dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate AI service
        run: python -m compileall -q app

      # Database tests fail (not skip) here if the pgvector service is missing (tests/conftest.py).
      - name: Run AI service tests
        run: pytest -q

      # The image Render deploys: catches a broken Dockerfile or start script before a deploy.
      - name: Build AI service image
        run: docker build -t ppa-ai-service:ci .